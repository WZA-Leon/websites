<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>内容已迁移 - WZA Leon</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: #1a1d29;
            background: #f7f9fc;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            text-align: center;
        }
        .migration-card {
            max-width: 460px;
            padding: 32px 28px;
            background: #fff;
            border: 1px solid #e6eaf2;
            border-radius: 18px;
            box-shadow: 0 18px 44px rgba(77, 107, 254, 0.1);
        }
        h1 { margin: 0 0 10px; font-size: 1.25rem; }
        p { margin: 0 0 8px; color: #5a6072; line-height: 1.8; }
        a { color: #4d6bfe; font-weight: 600; }
    </style>
</head>
<body>
    <div class="migration-card">
        <h1>内容已迁移到博客</h1>
        <p>这份指南现在作为博客文章继续维护，正在为你跳转…</p>
        <p><a id="migrationLink" href="blog.html">如果没有自动跳转，点这里</a></p>
    </div>

    <script>
        (function () {
            const id = new URLSearchParams(window.location.search).get('id');
            const target = id
                ? 'post.html?id=' + encodeURIComponent(id)
                : 'blog.html';
            const link = document.getElementById('migrationLink');
            if (link) link.href = target;
            window.location.replace(target);
        })();
    </script>
</body>
</html>
