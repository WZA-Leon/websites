<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源 - WZA-Leon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/page-loader.css">
    <script src="js/page-loader.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/docs.css">
</head>
<body data-doc-type="resource">
    <div id="nav-placeholder"></div>

    <main class="doc-page">
        <div class="container">
            <a class="doc-back" href="resources.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> 返回资源库</a>

            <header class="doc-hero">
                <p class="doc-kicker">RESOURCE FILE</p>
                <h1 id="docTitle">正在加载资源…</h1>
                <p class="doc-description" id="docDescription"></p>
                <div class="doc-meta">
                    <span><i class="fas fa-folder" aria-hidden="true"></i> <span id="docCategory">资源</span></span>
                    <span><i class="fas fa-calendar" aria-hidden="true"></i> <span id="docDate"></span></span>
                    <span><i class="fas fa-clock" aria-hidden="true"></i> 阅读约 <span id="docReadTime">1</span> 分钟</span>
                </div>
                <div class="doc-meta" id="docTags"></div>
                <div class="doc-actions" id="docActions"></div>
            </header>

            <article class="doc-content" id="docContent">
                <p class="doc-error">正在加载资源内容…</p>
            </article>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
    <script src="js/resources-list.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="js/doc-page.js"></script>
</body>
</html>
