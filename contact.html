<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - SiveNioo Studios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <!-- 联系页面内容 -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-text">
                    <h1>联系<span>我们</span></h1>
                    <p>有项目合作或疑问？随时联系我们，我们期待与您交流。</p>
                    <div class="hero-buttons">
                        <a href="mailto:erjiuwuqi@outlook.com" class="btn">发送邮件</a>
                        <a href="services.html" class="btn btn-accent">查看服务</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 联系信息 -->
    <section class="section contact">
        <div class="container">
            <div class="section-title">
                <h2>联系方式</h2>
                <p>多种方式与我们取得联系</p>
            </div>
            
            <div class="contact-grid">
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <h3>邮箱</h3>
                    <a href="wza-dl@outlook.com" class="btn">发送邮件</a>
                </div>
                
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <h3>电话</h3>
                    <p>+86 130 1942 8653</p>
                    <a href="tel:+86 13840926806" class="btn">拨打电话</a>
                </div>
                
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <h3>地址</h3>
                    <p>大连市甘井子区</p>
                    <a href="#" class="btn">查看地图</a>
                </div>
                
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <h3>工作时间</h3>
                    <p>周日: 7:30-14:00</p>
                    <p>其他时间请邮件联系</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
</body>
</html>
