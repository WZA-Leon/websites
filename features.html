<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>功能 - SiveNioo Studios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <!-- 功能页面内容 -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-text">
                    <h1>核心<span>功能</span></h1>
                    <p>WZA提供全方位的多学科内容，确保您能获得新的知识。</p>
                    <div class="hero-buttons">
                        <a href="services.html" class="btn">查看服务</a>
                        <a href="contact.html" class="btn btn-accent">联系WZA</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 功能区域 -->
    <section class="section features">
        <div class="container">
            <div class="section-title">
                <h2>WZA的专长</h2>
                <p>涵盖多个领域，为您提供专业内容</p>
            </div>
            
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-icon">
                        <i class="fas fa-laptop-code"></i>
                    </div>
                    <h3>文学</h3>
                    <p>WZA有文学创作，涵盖小说、诗歌、散文等方面，为您提供优质的文学作品。</p>
                </div>
                
                <div class="feature-card">
                    <div class="feature-icon">
                        <i class="fas fa-bolt"></i>
                    </div>
                    <h3>数理化</h3>
                    <p>WZA研究理科内容，出于热爱，为科学爱好者提供深入的知识分享。</p>
                </div>
                
                <div class="feature-card">
                    <div class="feature-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h3>艺术</h3>
                    <p>WZA喜欢艺术创作，有音乐、美术、设计等，为创意人士提供灵感。</p>
                </div>
                
                <div class="feature-card">
                    <div class="feature-icon">
                        <i class="fas fa-search"></i>
                    </div>
                    <h3>计算机</h3>
                    <p>WZA开发软件，涵盖编程、算法、系统设计等技术领域。</p>
                </div>
                
                <div class="feature-card">
                    <div class="feature-icon">
                        <i class="fas fa-camera"></i>
                    </div>
                    <h3>摄影</h3>
                    <p>WZA喜欢摄影，记录生活中的美好瞬间，为创意人士提供视觉灵感。</p>
                </div>
                
                <div class="feature-card">
                    <div class="feature-icon">
                        <i class="fas fa-headset"></i>
                    </div>
                    <h3>游戏</h3>
                    <p>WZA也玩游戏，分享游戏经验和开发心得。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
