<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷站导航 - WZA Leon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <!-- 编程作品页面内容 -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-text">
                    <h1>资源<span>与 链接</span></h1>
                    <p>收集我常用的学习资源、工具与灵感来源，供同学参考。</p>
                    <div class="hero-buttons">
                        <a href="contact.html" class="btn">联系我</a>
                        <a href="about.html" class="btn btn-accent">了解更多</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 项目展示 -->
    <section class="section projects">
        <div class="container">
            <div class="section-title">
                <h2>项目集</h2>
                <p>精选编程项目，展现不同的技术栈和应用场景</p>
            </div>
            
            <div class="projects-grid">
                <div class="project-card">
                    <div class="project-image">
                        <img src="images/project.png" alt="项目1">
                        <div class="project-tech">
                            <span>Python</span>
                            <span>Flask</span>
                            <span>HTML/CSS</span>
                        </div>
                    </div>
                    <div class="project-content">
                        <h3>个人博客系统</h3>
                        <p>基于 Flask 的个人博客网站，支持文章发布、评论系统等功能。</p>
                        <div class="project-links">
                            <a href="#" class="btn btn-small">查看演示</a>
                            <a href="#" class="btn btn-small btn-accent">源码</a>
                        </div>
                    </div>
                </div>
                
                <div class="project-card">
                    <div class="project-image">
                        <img src="images/project.png" alt="项目2">
                        <div class="project-tech">
                            <span>JavaScript</span>
                            <span>Node.js</span>
                            <span>React</span>
                        </div>
                    </div>
                    <div class="project-content">
                        <h3>任务管理应用</h3>
                        <p>现代化的任务管理工具，支持团队协作和项目跟踪。</p>
                        <div class="project-links">
                            <a href="#" class="btn btn-small">查看演示</a>
                            <a href="#" class="btn btn-small btn-accent">源码</a>
                        </div>
                    </div>
                </div>
                
                <div class="project-card">
                    <div class="project-image">
                        <img src="images/project.png" alt="项目3">
                        <div class="project-tech">
                            <span>Python</span>
                            <span>TensorFlow</span>
                            <span>AI/ML</span>
                        </div>
                    </div>
                    <div class="project-content">
                        <h3>AI 图像识别</h3>
                        <p>基于深度学习的图像识别项目，支持多种物体识别。</p>
                        <div class="project-links">
                            <a href="#" class="btn btn-small">查看演示</a>
                            <a href="#" class="btn btn-small btn-accent">源码</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚占位（由 script.js 注入） -->
    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
</body>
</html>
